name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: |
          V="$(cat VERSION)"
          echo "VERSION=${V}" >> "$GITHUB_OUTPUT"
          echo "VERSION_MAJOR_MINOR=${V%.*}" >> "$GITHUB_OUTPUT"

      # Das Build-Image MUSS zuerst existieren (und gepusht sein), weil das
      # Runtime-Image per COPY --from=libs davon abhängt → sequentiell.
      - name: Build and push build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION }}
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION_MAJOR_MINOR }}
            ghcr.io/lukaslow/mojo:latest
          build-args: |
            MOJO_VERSION=${{ steps.version.outputs.VERSION }}

      - name: Build and push runtime-image
        uses: docker/build-push-action@v6
        with:
          context: ./runtime
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION }}-runtime
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION_MAJOR_MINOR }}-runtime
            ghcr.io/lukaslow/mojo:latest-runtime
          build-args: |
            MOJO_VERSION=${{ steps.version.outputs.VERSION }}
            REGISTRY=ghcr.io/lukaslow/mojo
