name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: |
          V="$(cat VERSION)"
          echo "VERSION=${V}" >> "$GITHUB_OUTPUT"
          echo "VERSION_MAJOR_MINOR=${V%.*}" >> "$GITHUB_OUTPUT"

      # Build the build image for the runner platform (linux/amd64) and load it
      # into the local daemon so the example build in the "test" step can use it.
      - name: Build build image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION }}
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION_MAJOR_MINOR }}
            ghcr.io/lukaslow/mojo:latest
          build-args: |
            MOJO_VERSION=${{ steps.version.outputs.VERSION }}

      # Test: build the example app with the freshly built (local) image and
      # verify its output. If this fails the job fails and no push happens.
      - name: Test example app
        run: |
          docker build \
            --build-arg MOJO_IMAGE=ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION }} \
            -t mojo-hello-test \
            ./examples
          docker run --rm mojo-hello-test | grep -q "hello from mojo"

      # Only now push the multi-arch (arm64 + amd64) build to GHCR.
      - name: Build and push build image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION }}
            ghcr.io/lukaslow/mojo:${{ steps.version.outputs.VERSION_MAJOR_MINOR }}
            ghcr.io/lukaslow/mojo:latest
          build-args: |
            MOJO_VERSION=${{ steps.version.outputs.VERSION }}
